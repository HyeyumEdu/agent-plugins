[project]
name = "hyeyum-hwpx-toolkit-mcp"
version = "1.4.1"
description = "HWPX 시험지 작성·수정 MCP (python-hwpx 개선판 포함)"
requires-python = ">=3.10"
# 업스트림 서버 python-hwpx-automation 7.3.4는 src/hwpx_automation/에 소스로 들어 있다(PyPI에서 받지 않음).
# 아래는 그 패키지가 요구하던 의존성(+[mcp])이다.
dependencies = [
  "python-hwpx",
  "pydantic>=2.11,<3",
  "cryptography>=42.0",
  "anyio>=4.0",
  "tomli>=2.0; python_version < '3.11'",
  "mcp==1.28.1",
]

# 개선한 python-hwpx(포크)를 번들한 wheel로 설치한다. 사용자 PC에 git이 없어도 된다.
[tool.uv.sources]
python-hwpx = { path = "wheels/python_hwpx-6.8.0-py3-none-any.whl" }
